name: Release — Build & Publish Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Linux .deb ─────────────────────────────────────────────────────────
  build-linux-deb:
    name: Linux .deb (Ubuntu 22.04 amd64)
    runs-on: ubuntu-22.04   # pin to 22.04 so binary links against GLIBC 2.35 (max compat)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build PyInstaller binary
        working-directory: dpdpa-agent
        run: |
          python -m PyInstaller veritas-linux.spec --noconfirm

      - name: Build .deb package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x package/build-deb.sh
          bash package/build-deb.sh dpdpa-agent/dist/veritas-runtime $VERSION amd64

      - name: Upload .deb artifact (for release-notes job)
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/veritas_*.deb
          retention-days: 1

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/veritas_*.deb

  # ── macOS .pkg ────────────────────────────────────────────────────────
  build-macos-pkg:
    name: macOS .pkg (Apple Silicon arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build PyInstaller binary
        working-directory: dpdpa-agent
        run: |
          python -m PyInstaller veritas-mac.spec --noconfirm

      - name: Build .pkg installer
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x package/macos/build-pkg.sh
          bash package/macos/build-pkg.sh dpdpa-agent/dist/veritas-runtime $VERSION arm64

      - name: Upload .pkg artifact (for release-notes job)
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/veritas_*.pkg
          retention-days: 1

      - name: Upload .pkg to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/veritas_*.pkg

  # ── Windows .exe installer ────────────────────────────────────────────
  build-windows-exe:
    name: Windows installer (amd64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build PyInstaller runtime
        working-directory: dpdpa-agent
        run: python -m PyInstaller veritas.spec --noconfirm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go launcher
        working-directory: veritas-launcher
        run: |
          go build -ldflags="-s -w" -o ../dpdpa-agent/dist/veritas-launcher.exe .

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force installer/output | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$VERSION" "installer\veritas-installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/veritas_*_windows_amd64.exe

  # ── Agent .deb (lightweight — no PyInstaller) ─────────────────────────
  build-agent-deb:
    name: Agent .deb (all architectures)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build veritas-agent .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x package/build-agent-deb.sh
          bash package/build-agent-deb.sh $VERSION all

      - name: Upload agent .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/veritas-agent_*.deb

  # ── Release notes ─────────────────────────────────────────────────────
  publish-release-notes:
    name: Publish release notes with install instructions
    runs-on: ubuntu-latest
    needs: [build-linux-deb, build-macos-pkg, build-windows-exe, build-agent-deb]
    permissions:
      contents: write
    steps:
      - name: Strip v-prefix from tag for filenames
        run: echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update release with install instructions
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Veritas DPDPA Compliance Platform ${{ github.ref_name }}

            ### Quick Install

            **Linux (Ubuntu 22.04+ / Debian 11+):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/shreyaaassss/Veritas/main/install.sh | sudo bash
            ```
            Or manually:
            ```bash
            wget https://github.com/shreyaaassss/Veritas/releases/download/${{ github.ref_name }}/veritas_${{ env.VER }}_amd64.deb
            sudo dpkg -i veritas_${{ env.VER }}_amd64.deb
            sudo systemctl start veritas
            ```

            **Windows (amd64):**
            ```
            Download veritas_${{ env.VER }}_windows_amd64.exe and run as Administrator
            ```
            The installer prompts for your `.vlic` license file during setup.

            **macOS (Apple Silicon):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/shreyaaassss/Veritas/main/install.sh | sudo bash
            ```
            Or download `veritas_${{ env.VER }}_arm64.pkg` from the assets below and double-click.

            ### After Installation (Server)

            1. `sudo veritas fingerprint` — send the output to your Veritas contact
            2. `sudo veritas license /path/to/veritas.vlic` — install license
            3. `sudo veritas start` — start the server
            4. Open http://localhost:8000/setup — create admin account

            CLI: `veritas {start|stop|restart|status|logs|fingerprint|license|check}`

            ### Agent Install (on each monitored server)

            ```bash
            wget https://github.com/shreyaaassss/Veritas/releases/download/${{ github.ref_name }}/veritas-agent_${{ env.VER }}_all.deb
            sudo dpkg -i veritas-agent_${{ env.VER }}_all.deb
            sudo veritas-agent fetch-cert https://your-veritas-server:8000
            sudo nano /etc/veritas-agent/config.yaml   # set server_url, org_id, registration_key
            sudo veritas-agent start
            ```

            Get a registration key from the Veritas dashboard → **Agents** tab → **Issue Key**.

            ### Requirements

            - **Server**: Ubuntu 22.04+ / Debian 11+ or macOS 12+, systemd, 2 GB RAM, 1 GB disk
            - **Agent**: Ubuntu 18.04+, python3, python3-requests, python3-yaml (auto-installed)
          append_body: false
