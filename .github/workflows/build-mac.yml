name: Build macOS Runtime (Apple Silicon)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dpdpa-agent/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac-arm:
    name: Build veritas-runtime (macOS arm64 / Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: mac-pip-${{ runner.arch }}-py312-${{ hashFiles('dpdpa-agent/requirements.txt') }}
          restore-keys: |
            mac-pip-${{ runner.arch }}-py312-

      - name: Install Python dependencies
        working-directory: dpdpa-agent
        run: |
          # Use --prefer-binary to avoid source builds that can fail on macOS arm64
          # Use flexible versions (>=) instead of strict pins
          pip install --prefer-binary \
            "fastapi>=0.115.0" \
            "uvicorn[standard]>=0.30.0" \
            "pydantic>=2.8.0" \
            "pydantic[email]" \
            "pyyaml>=6.0" \
            "openai>=1.0.0" \
            "requests>=2.31.0" \
            "httpx>=0.27.0" \
            "cryptography>=41.0.0" \
            "presidio-analyzer>=2.2.0" \
            "presidio-anonymizer>=2.2.0" \
            "spacy>=3.7.0"

      - name: Cache spaCy model
        uses: actions/cache@v4
        id: spacy-cache
        with:
          path: |
            ~/Library/Python/3.12/lib/python/site-packages/en_core_web_lg
            /Users/runner/hostedtoolcache/Python/3.12.10/arm64/lib/python3.12/site-packages/en_core_web_lg
          key: spacy-en-core-web-lg-mac-arm64-v2

      - name: Download spaCy language model
        if: steps.spacy-cache.outputs.cache-hit != 'true'
        run: python -m spacy download en_core_web_lg

      - name: Build with PyInstaller
        working-directory: dpdpa-agent
        run: |
          python -m PyInstaller veritas-mac.spec --noconfirm
          ls -lh dist/veritas-runtime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: veritas-runtime-macos-arm64
          path: dpdpa-agent/dist/veritas-runtime
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        working-directory: dpdpa-agent
        run: |
          SIZE=$(du -sh dist/veritas-runtime | cut -f1)
          echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | \`veritas-runtime\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Arch | arm64 (M1/M2/M3/M4/M5) |" >> $GITHUB_STEP_SUMMARY
          echo "| Download | Artifacts section below |" >> $GITHUB_STEP_SUMMARY
