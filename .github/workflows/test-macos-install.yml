name: Test macOS .pkg Installation

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test-macos-pkg:
    name: Install & smoke-test veritas .pkg on macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest release tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.4")
          VER=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER"  >> $GITHUB_OUTPUT

      - name: Download .pkg from release
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          VER=${{ steps.tag.outputs.ver }}
          echo "Downloading veritas_${VER}_arm64.pkg ..."
          curl -L \
            "https://github.com/shreyaaassss/Veritas/releases/download/${TAG}/veritas_${VER}_arm64.pkg" \
            -o /tmp/veritas.pkg
          ls -lh /tmp/veritas.pkg

      - name: Install .pkg
        run: sudo installer -pkg /tmp/veritas.pkg -target /

      - name: Verify CLI installed
        run: veritas version

      - name: Get machine fingerprint
        run: sudo veritas fingerprint

      - name: Generate test license using production key
        env:
          VERITAS_PRIVATE_KEY_B64: ${{ secrets.VERITAS_PRIVATE_KEY_B64 }}
        run: |
          python3 -m venv /tmp/licvenv
          /tmp/licvenv/bin/pip install cryptography --quiet

          # Decode production private key from GitHub secret
          echo "$VERITAS_PRIVATE_KEY_B64" | base64 -d > /tmp/ci_private_key.pem

          # Generate any-machine license (no fingerprint — CI runner changes each run)
          /tmp/licvenv/bin/python3 tools/generate_license.py \
            --org "ci-test" \
            --tier enterprise \
            --expiry 2027-12-31 \
            --key /tmp/ci_private_key.pem \
            --out /tmp/ci-test.vlic
          echo "License generated."

      - name: Install license and fix ownership BEFORE starting daemon
        run: |
          # Copy license directly (bypass the CLI which chowns incorrectly)
          sudo cp /tmp/ci-test.vlic /var/lib/veritas/veritas.vlic
          sudo xattr -c /var/lib/veritas/veritas.vlic 2>/dev/null || true
          sudo chown _veritas:staff /var/lib/veritas/veritas.vlic
          sudo chmod 640 /var/lib/veritas/veritas.vlic
          echo "License installed:"
          sudo ls -la /var/lib/veritas/veritas.vlic

      - name: Bootstrap daemon
        run: |
          sudo launchctl bootout system /Library/LaunchDaemons/com.veritas.daemon.plist 2>/dev/null || true
          sleep 2
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.veritas.daemon.plist

      - name: Check daemon status immediately after bootstrap
        run: |
          sleep 5
          echo "=== launchctl status ==="
          sudo launchctl print system/com.veritas.daemon 2>&1 | grep -E "state|pid|exit|environment|username" || true
          echo "=== Error log so far ==="
          sudo cat /var/log/veritas/veritas-error.log 2>/dev/null || echo "(no error log yet)"
          echo "=== Stdout log so far ==="
          sudo cat /var/log/veritas/veritas.log 2>/dev/null || echo "(no stdout log yet)"

      - name: Wait for server to start (spaCy takes ~60s on CI)
        run: |
          echo "Waiting for server..."
          for i in $(seq 1 24); do
            RESP=$(curl -sk https://localhost:8000/health 2>/dev/null || echo "")
            if echo "$RESP" | grep -q '"status":"ok"'; then
              echo "Server is UP: $RESP"
              exit 0
            fi
            echo "  attempt $i/24 — not ready yet ($((i*5))s elapsed)"
            sleep 5
          done
          echo "Server did not start in 120s."
          echo "=== Full error log ==="
          sudo cat /var/log/veritas/veritas-error.log 2>/dev/null || true
          echo "=== Stdout log ==="
          sudo cat /var/log/veritas/veritas.log 2>/dev/null || true
          echo "=== launchctl final state ==="
          sudo launchctl print system/com.veritas.daemon 2>&1 || true
          exit 1

      - name: Health check
        run: |
          HEALTH=$(curl -sk https://localhost:8000/health)
          echo "Health: $HEALTH"
          echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', f'Bad health: {d}'"

      - name: Ready endpoint
        run: curl -sk https://localhost:8000/ready | python3 -m json.tool || true

      - name: Check setup page accessible
        run: |
          HTTP=$(curl -sk -w "\nHTTP_STATUS:%{http_code}" https://localhost:8000/setup 2>/dev/null || echo "CURL_FAILED")
          echo "Setup page response: $HTTP"
          STATUS=$(echo "$HTTP" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Status code: $STATUS"
          if [[ ! "$STATUS" =~ ^(200|302|303)$ ]]; then
            echo "=== Server error log (last 40 lines) ==="
            sudo tail -40 /var/log/veritas/veritas-error.log 2>/dev/null || true
            echo "=== Also check if setup.html is in bundle ==="
            ls /var/lib/veritas/tmp/ 2>/dev/null | head -5 || true
            sudo find /var/lib/veritas/tmp -name "setup.html" 2>/dev/null || true
            echo "=== Try /login page ==="
            curl -sko /dev/null -w "login page: %{http_code}\n" https://localhost:8000/login
            exit 1
          fi

      - name: Print install summary
        run: |
          echo "================================================"
          echo "  Veritas macOS Install Test: PASSED"
          echo "  Server:  https://localhost:8000"
          echo "  License: CI any-machine enterprise"
          echo "================================================"
          sudo launchctl print system/com.veritas.daemon | grep -E "state|pid|exit" || true
