name: Test Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test-windows:
    name: Install & smoke-test veritas on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest release tag
        id: tag
        shell: bash
        run: |
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.12")
          VER=${TAG#v}
          echo "Using release: $TAG (version $VER)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER"  >> $GITHUB_OUTPUT

      - name: Disable Windows Defender real-time scanning (speeds up large installer)
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Write-Host "Defender real-time monitoring disabled"

      - name: Download Windows installer
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $ver = "${{ steps.tag.outputs.ver }}"
          $url = "https://github.com/shreyaaassss/Veritas/releases/download/$tag/veritas_${ver}_windows_amd64.exe"
          Write-Host "Downloading $url ..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest $url -OutFile "C:\veritas-setup.exe" -UseBasicParsing
          $sz = [math]::Round((Get-Item "C:\veritas-setup.exe").Length / 1MB)
          Write-Host "Downloaded: ${sz}MB"

      - name: Extract installer with 7-Zip (bypass Inno Setup for CI speed)
        shell: pwsh
        run: |
          # 7-Zip can extract Inno Setup installers directly
          # This is much faster than running the full installer in CI
          Write-Host "Extracting installer contents with 7-Zip..."
          $extractDir = "C:\veritas-extracted"
          & "C:\Program Files\7-Zip\7z.exe" x "C:\veritas-setup.exe" -o"$extractDir" -y | Select-String -Pattern "Everything|Error|Warning"

          # Create install directory and copy binaries
          $installDir = "C:\Program Files\Veritas"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          # Find and copy the executables (7-Zip extracts to flat structure)
          $runtime = Get-ChildItem $extractDir -Recurse -Filter "veritas-runtime.exe" | Select-Object -First 1
          $launcher = Get-ChildItem $extractDir -Recurse -Filter "veritas-launcher.exe" | Select-Object -First 1

          if ($runtime) {
            Copy-Item $runtime.FullName "$installDir\veritas-runtime.exe"
            Write-Host "RUNTIME_EXE: OK ($([math]::Round($runtime.Length/1MB))MB)"
          } else { throw "veritas-runtime.exe not found in installer" }

          if ($launcher) {
            Copy-Item $launcher.FullName "$installDir\veritas-launcher.exe"
            Write-Host "LAUNCHER_EXE: OK ($([math]::Round($launcher.Length/1KB))KB)"
          } else { throw "veritas-launcher.exe not found in installer" }

      - name: Register Windows Service
        shell: pwsh
        run: |
          Write-Host "Registering VeritasService..."
          & "C:\Program Files\Veritas\veritas-launcher.exe" install 2>&1
          $svc = Get-Service "VeritasService" -ErrorAction SilentlyContinue
          Write-Host "SERVICE_REGISTERED: $($null -ne $svc)"
          if (-not $svc) { throw "Service registration failed" }

      - name: Generate CI test license (any-machine)
        shell: bash
        run: |
          python3 -m venv /tmp/licvenv
          /tmp/licvenv/bin/pip install cryptography --quiet
          /tmp/licvenv/bin/python3 tools/generate_license.py \
            --org "ci-windows-test" \
            --tier enterprise \
            --expiry 2027-12-31 \
            --key tools/private_key.pem \
            --out /tmp/ci-win.vlic
          echo "License generated"
        env:
          VERITAS_PRIVATE_KEY_B64: ${{ secrets.VERITAS_PRIVATE_KEY_B64 }}

      - name: Install license
        shell: pwsh
        run: |
          $dir = "C:\Program Files\Veritas"
          Copy-Item "C:\Users\runneradmin\AppData\Local\Temp\ci-win.vlic" "$dir\veritas.vlic" -ErrorAction SilentlyContinue
          # Try alternate path
          $src = (Get-ChildItem "C:\*\ci-win.vlic" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $src) { $src = "/tmp/ci-win.vlic" }
          Copy-Item $src "$dir\veritas.vlic" -ErrorAction SilentlyContinue
          Write-Host "License installed: $(Test-Path "$dir\veritas.vlic")"

      - name: Find and install license (robust path)
        shell: bash
        run: |
          INSTALL_DIR="C:/Program Files/Veritas"
          cp /tmp/ci-win.vlic "$INSTALL_DIR/veritas.vlic"
          echo "License at: $INSTALL_DIR/veritas.vlic"
          ls -la "$INSTALL_DIR/veritas.vlic"

      - name: Start Veritas service (after license is installed)
        shell: pwsh
        run: |
          Write-Host "Starting VeritasService (license installed, now starting)..."
          # Installer registers service but does NOT start it (correct behavior)
          # Start it now that the license is in place
          & "C:\Program Files\Veritas\veritas-launcher.exe" start 2>&1
          Start-Sleep -Seconds 5
          $svc = Get-Service "VeritasService" -ErrorAction SilentlyContinue
          Write-Host "SERVICE_STATUS: $($svc.Status)"

      - name: Wait for spaCy model to load (~90s)
        shell: pwsh
        run: |
          Write-Host "Waiting 90s for spaCy model..."
          Start-Sleep -Seconds 90

      - name: Health check
        shell: pwsh
        run: |
          Write-Host "=== HEALTH CHECK ==="
          $svc = Get-Service "VeritasService" -ErrorAction SilentlyContinue
          Write-Host "SERVICE_STATUS: $($svc.Status)"

          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
              Write-Host "HEALTH_HTTP: $($r.StatusCode)"
              Write-Host "HEALTH_BODY: $($r.Content)"
              break
            } catch {
              Write-Host "  attempt $i/10 — $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }

      - name: Check setup page
        shell: pwsh
        run: |
          try {
            $r = Invoke-WebRequest "http://localhost:8000/setup" -UseBasicParsing -TimeoutSec 10
            Write-Host "SETUP_HTTP: $($r.StatusCode)"
          } catch {
            Write-Host "SETUP_HTTP: $($_.Exception.Response.StatusCode.value__)"
          }

      - name: Print summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "  Veritas Windows Install Test COMPLETE"
          Write-Host "================================================"
          Get-Service "VeritasService" -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Program Files\Veritas\" | Select-Object Name, Length
