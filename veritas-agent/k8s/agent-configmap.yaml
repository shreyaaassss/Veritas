# Agent configuration for the DaemonSet (one agent per node).
#
# Edit before applying:
#   veritas_address  where the Veritas server can be reached from the cluster
#   rules            which pods' logs to send, and the source_system each one belongs to.
#                    source_system must match a system declared in the organisation's
#                    policy in Veritas. Logs of pods that match no rule are ignored.
#
# ${NAME} is filled in from the pod's environment: the key comes from the Secret and
# NODE_NAME from the node, so nothing secret lives in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: veritas-agent-config
  namespace: veritas-agent
  labels:
    app.kubernetes.io/name: veritas-agent
data:
  agent-config.yaml: |
    veritas_address: https://veritas.example.internal:8000
    registration_key: "${VERITAS_REGISTRATION_KEY}"
    source_label: "k8s-${NODE_NAME}"

    sources:
      # Container logs written by the container runtime on this node.
      - type: kubernetes_logs
        path: /var/log/containers/*.log
        format: auto                    # understands containerd/CRI-O and Docker json-file lines
        rules:
          # all keys in "match" must match (shell wildcards); the first matching rule wins
          - match: {namespace: shop, pod: "order-*"}
            source_system: order-service
          - match: {namespace: shop, container: "payments*"}
            source_system: payments-service
          # placeholders: {namespace} {pod} {container}
          # - match: {namespace: "team-*"}
          #   source_system: "{namespace}-{container}"
