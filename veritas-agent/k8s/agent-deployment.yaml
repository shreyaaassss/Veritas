# Alternative to the DaemonSet: ONE agent that reads specific files, for example log files
# your applications write to a shared volume. For node-level pod logs use the DaemonSet.
#
# Before applying, create the namespace, the key Secret and the ConfigMap, and change the
# ConfigMap's sources to plain file sources, for example:
#
#   sources:
#     - type: file
#       path: /logs/*.log             # wildcards are allowed
#       source_system: order-service
#
# and replace the "logs" volume below with the volume your applications write to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veritas-agent
  namespace: veritas-agent
  labels:
    app.kubernetes.io/name: veritas-agent
spec:
  replicas: 1                        # exactly one; more would send every line twice
  strategy:
    type: Recreate                   # the identity volume can be used by one pod at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: veritas-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veritas-agent
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: ghcr.io/shreyaaassss/veritas-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/agent.py"]
          args: ["--config", "/config/agent-config.yaml"]
          workingDir: /state
          env:
            - name: VERITAS_STATE_DIR
              value: /state
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VERITAS_REGISTRATION_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-agent-key
                  key: registration_key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: state,  mountPath: /state}
            - {name: logs,   mountPath: /logs,   readOnly: true}
            - {name: tmp,    mountPath: /tmp}
          resources:
            requests: {cpu: 50m,  memory: 64Mi}
            limits:   {cpu: 250m, memory: 256Mi}
      volumes:
        - name: config
          configMap:
            name: veritas-agent-config
        - name: state
          persistentVolumeClaim:
            claimName: veritas-agent-state
        - name: logs
          emptyDir: {}               # REPLACE with the volume your applications write logs to
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: veritas-agent-state
  namespace: veritas-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Mi
