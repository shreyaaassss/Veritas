# Veritas Agent — Registration Key Secret
# =========================================
# Stores the one-time registration key issued from the Veritas dashboard.
#
# Steps:
#   1. Go to Veritas Dashboard → Agents → Issue Registration Key
#   2. Copy the key
#   3. Base64-encode it:
#        Linux/Mac:  echo -n "YOUR_KEY_HERE" | base64
#        Windows:    [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("YOUR_KEY_HERE"))
#   4. Paste the result into the registration_key value below
#   5. Apply: kubectl apply -f agent-secret.yaml
#
# After the Agent registers successfully, the key is consumed (single-use).
# The Agent stores its permanent identity in the veritas-agent-state PVC.

apiVersion: v1
kind: Secret
metadata:
  name: veritas-agent-secret
  namespace: default
  labels:
    app: veritas-agent
    component: credentials
type: Opaque
data:
  # Base64-encoded registration key from the Veritas dashboard.
  # Replace this placeholder with your actual encoded key.
  registration_key: REPLACE_WITH_BASE64_ENCODED_KEY
