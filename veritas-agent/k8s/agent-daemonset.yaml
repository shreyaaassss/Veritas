# Veritas Agent as a DaemonSet: one agent on every node, reading the logs of the pods on
# that node. No change to your applications is needed.
#
# Before applying, create the namespace, the key Secret and the ConfigMap (see README.md).
#
# Why it looks the way it does:
#  * The agent's identity (its id and token) is kept in /state on the node, so a pod restart
#    or an image upgrade does not need a new key. It is NOT mounted over /app, which holds
#    the agent program.
#  * It runs as root because the kubelet writes container logs as root-only files. The
#    root filesystem is read-only, all Linux capabilities are dropped, and the only host
#    path mounted read-write is the agent's own state directory.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: veritas-agent
  namespace: veritas-agent
  labels:
    app.kubernetes.io/name: veritas-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: veritas-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veritas-agent
    spec:
      automountServiceAccountToken: false    # the agent never talks to the Kubernetes API
      tolerations:
        - operator: Exists                   # run on every node, including control-plane nodes
      containers:
        - name: agent
          image: ghcr.io/shreyaaassss/veritas-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/agent.py"]
          args: ["--config", "/config/agent-config.yaml"]
          workingDir: /state
          env:
            - name: VERITAS_STATE_DIR
              value: /state
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VERITAS_REGISTRATION_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-agent-key
                  key: registration_key
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config,  mountPath: /config,    readOnly: true}
            - {name: state,   mountPath: /state}
            - {name: varlog,  mountPath: /var/log,   readOnly: true}
            - {name: tmp,     mountPath: /tmp}
          resources:
            requests: {cpu: 50m,  memory: 64Mi}
            limits:   {cpu: 250m, memory: 256Mi}
      volumes:
        - name: config
          configMap:
            name: veritas-agent-config
        - name: state
          hostPath:
            path: /var/lib/veritas-agent
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: tmp
          emptyDir: {}
