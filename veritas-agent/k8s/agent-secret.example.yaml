# Registration key for the agents (do not commit a real key).
#
# Easiest: create the Secret from the command line instead of editing this file:
#
#   kubectl -n veritas-agent create secret generic veritas-agent-key \
#     --from-literal=registration_key='<THE KEY FROM THE DASHBOARD>'
#
# Use a REUSABLE key (dashboard -> Agents -> Issue Registration Key -> "Many agents"),
# because every node's agent registers itself with it. Revoke it in the dashboard once
# the rollout is finished; agents that already registered keep working.
apiVersion: v1
kind: Secret
metadata:
  name: veritas-agent-key
  namespace: veritas-agent
type: Opaque
stringData:
  registration_key: REPLACE_WITH_THE_REUSABLE_KEY
