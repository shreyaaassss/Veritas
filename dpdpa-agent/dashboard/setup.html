<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veritas — Initial Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #000;
      color: #ededed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #0c0c0c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 48px rgba(0,0,0,0.7);
    }
    .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.04em; color: #fff; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.78rem; color: #555; margin-bottom: 0.75rem; }
    .desc {
      font-size: 0.8rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 1.75rem;
      padding: 0.75rem;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      border-left: 2px solid rgba(255,255,255,0.15);
    }
    label { display: block; font-size: 0.78rem; color: #888; margin-bottom: 0.35rem; font-weight: 500; }
    input {
      width: 100%;
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: #ededed;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      margin-bottom: 1.1rem;
    }
    input:focus { border-color: rgba(255,255,255,0.35); }
    .btn {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 0.5rem;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(255,91,79,0.1);
      border: 1px solid rgba(255,91,79,0.3);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      font-size: 0.8rem;
      color: #ff5b4f;
      margin-bottom: 1rem;
      display: none;
    }
    .success {
      background: rgba(0,223,143,0.1);
      border: 1px solid rgba(0,223,143,0.3);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      font-size: 0.8rem;
      color: #00df8f;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">VERITAS</div>
    <div class="subtitle">Initial Administrator Setup</div>
    <div class="desc">
      This is the first-run setup screen. Create your administrator account to get started.
      Once created, this page will no longer be accessible.
    </div>

    <div class="error"   id="errorBox"></div>
    <div class="success" id="successBox"></div>

    <form id="setupForm" onsubmit="handleSetup(event)">
      <label for="username">Administrator Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             placeholder="e.g. admin" required minlength="3" autofocus />

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="admin@yourcompany.com" required />

      <label for="password">Password <span style="color:#555;font-weight:400">(min 8 characters)</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password"
             placeholder="Choose a strong password" required minlength="8" />

      <label for="confirm">Confirm Password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password"
             placeholder="Repeat your password" required minlength="8" />

      <button class="btn" type="submit" id="submitBtn">Create Administrator Account</button>
    </form>
  </div>

  <script>
    async function handleSetup(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox   = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      if (password !== confirm) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const r = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
          credentials: 'include',
        });
        const data = await r.json().catch(() => ({}));

        if (r.ok) {
          successBox.textContent = data.message + ' Redirecting to login…';
          successBox.style.display = 'block';
          document.getElementById('setupForm').style.display = 'none';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          errorBox.textContent = data.detail || 'Setup failed.';
          errorBox.style.display = 'block';
        }
      } catch {
        errorBox.textContent = 'Network error — could not reach Veritas server.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Administrator Account';
      }
    }
  </script>
</body>
</html>
